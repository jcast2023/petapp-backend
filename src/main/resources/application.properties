# Server
server.port=8080

# MySQL - Usando variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petapp}?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT - Usando variables de entorno
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSeguraParaJWT2026}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Cookie - Usando variables de entorno
app.cookie-secure=${COOKIE_SECURE:false}

# CORS - Usando variables de entorno
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.petapp.backend=DEBUG
logging.level.org.springframework.security=DEBUG