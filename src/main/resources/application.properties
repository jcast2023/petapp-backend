# Server
server.port=8080

# MySQL - Usando variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Usa 'update' temporalmente si agregaste tablas/columnas nuevas; cámbialo a 'validate' tras el despliegue exitoso)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - Usando variables de entorno
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSeguraParaJWT2026}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Cookie - Usando variables de entorno
app.cookie-secure=${COOKIE_SECURE:true}

# CORS - Usando variables de entorno
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.petapp.backend=INFO
logging.level.org.springframework.security=INFO

# HikariCP - Pool de conexiones para Clever Cloud Free
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.leak-detection-threshold=60000

# Configuracion de Mail (SMTP Gmail) con fallbacks defensivos
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true